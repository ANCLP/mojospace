name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi with prefix.dev OIDC Workload Identity
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          cache: true
          auth-host: prefix.dev
          auth-workload-identity: true

      - name: Install Environment
        run: pixi install

      - name: Run Test Suite
        run: pixi run test

      - name: Precompile mojospace Package (.mojoc)
        run: pixi run package

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/mojospace.mojoc
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Conda Package to prefix.dev
        run: pixi publish --to https://prefix.dev/anclp/mojospace --generate-attestation
