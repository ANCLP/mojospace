name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: Test & Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          cache: true

      - name: Install Environment
        run: pixi install

      - name: Run Test Suite
        run: pixi run test

      - name: Run Benchmark
        run: pixi run bench

      - name: Verify Package Precompilation
        run: pixi run package
